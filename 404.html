<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090b15">
    <title>Pàgina no trobada | Dance Revolution EF</title>
</head>
<body>
    <p id="message">Carregant la pàgina...</p>
    <script>
        const tabIds = ['motivacio', 'joc-complet', 'plantilla', 'recursos', 'comunitat', 'gestio'];
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        const requestedTab = pathSegments.pop();
        const basePath = `/${pathSegments.length ? `${pathSegments.join('/')}/` : ''}`;

        if (tabIds.includes(requestedTab)) {
            window.location.replace(`${basePath}?tab=${encodeURIComponent(requestedTab)}`);
        } else {
            document.querySelector('#message').textContent = 'No s’ha trobat aquesta pàgina.';
            const homeLink = document.createElement('a');
            homeLink.href = basePath;
            homeLink.textContent = 'Torna a Dance Revolution EF';
            document.querySelector('#message').append(' ', homeLink);
        }
    </script>
</body>
</html>
